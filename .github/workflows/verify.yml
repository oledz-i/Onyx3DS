# Fast re-check of an already-built package (no rebuild):
#   gh workflow run verify.yml -f run_id=<build run id>
name: verify
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run whose ONYX3DS-xbox artifact to check
        required: true
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ONYX3DS-xbox
          path: artifacts/ONYX3DS-xbox
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Import scan and launch test
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/verify-package.ps1
      - if: always()
        run: |
          lvl=warning; [ "${{ job.status }}" = success ] || lvl=error
          tools/ci-annotate.sh report-imports.txt Imports $lvl
          tools/ci-annotate.sh report-launch.txt Launch $lvl
