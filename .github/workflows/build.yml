# Builds ONYX 3DS on every push: unit tests on Linux, the full Xbox package
# on Windows. The .msix and its signing certificate are uploaded as an
# artifact you can install from the Xbox Device Portal.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shell-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S shell -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined" -DCMAKE_C_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ./build/onyx_shell_tests

  xbox-package:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build tools for Mesa
        run: |
          pip install meson ninja mako pyyaml packaging
          choco install winflexbison3 -y --no-progress
      - name: Cache sources
        uses: actions/cache@v4
        with:
          path: |
            deps/azahar
            deps/mesa
            deps/bin/dxil.dll
          key: deps-${{ hashFiles('patches/**') }}
      - name: Build everything
        shell: bash
        run: |
          set -o pipefail
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/build-all.ps1 -Configuration Release 2>&1 | tee build.log
      # Repeat the end of the log as an error annotation, so the failure is
      # readable from the run summary (and the API) without opening the log.
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          {
            echo "=== error lines ==="
            # Compiler/linker/MSBuild errors first (deduplicated), then anything else.
            grep -E "(: (fatal )?error [A-Z]+[0-9]+|error MSB[0-9]+|error LNK[0-9]+|CMake Error|Exception:)" build.log \
              | sed -E 's/ \[[^]]*\.vcxproj\]$//' | awk '!seen[$0]++' | head -n 40
            echo "=== last 60 lines ==="
            tail -n 25 build.log
          } > report.txt || true
          msg=$(sed -e 's/%/%25/g' -e 's/\r//g' report.txt | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Build log tail::${msg}"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ONYX3DS-xbox
          path: |
            out/AppPackages/**
            out/ONYX3DS.cer
          if-no-files-found: error
