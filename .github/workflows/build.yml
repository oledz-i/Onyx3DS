# ONYX 3DS CI. Azahar, Dozen and the app build in parallel so one run shows
# every stage's errors; build trees are cached even when a job fails, so the
# next run only recompiles what changed. The package job runs when all pass.
name: build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  shell-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S shell -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined" -DCMAKE_C_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build -j
      - run: ./build/onyx_shell_tests

  azahar:
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            deps/azahar
            deps/build/azahar
          key: azahar-${{ github.run_id }}
          restore-keys: azahar-
      - name: Build Azahar (UWP static core)
        run: |
          set -o pipefail
          pwsh -NoProfile -ExecutionPolicy Bypass -c "./tools/fetch-deps.ps1 -Only azahar; ./tools/build-azahar.ps1" 2>&1 | tee build.log
      - if: failure()
        run: tools/ci-report.sh build.log Azahar
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            deps/azahar
            deps/build/azahar
          key: azahar-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: azahar-lib
          retention-days: 3
          path: deps/lib/azahar_all.lib

  dozen:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install meson ninja mako pyyaml packaging
          choco install winflexbison3 -y --no-progress
      - uses: actions/cache/restore@v4
        with:
          path: |
            deps/mesa
            deps/build/mesa
            deps/bin/dxil.dll
          key: dozen-${{ github.run_id }}
          restore-keys: dozen-
      - name: Build Dozen (Vulkan on D3D12, UWP)
        run: |
          set -o pipefail
          pwsh -NoProfile -ExecutionPolicy Bypass -c "./tools/fetch-deps.ps1 -Only mesa,dxil; ./tools/build-dozen.ps1" 2>&1 | tee build.log
      - if: failure()
        run: tools/ci-report.sh build.log Dozen
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            deps/mesa
            deps/build/mesa
            deps/bin/dxil.dll
          key: dozen-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: dozen-bin
          retention-days: 3
          path: deps/bin/*.dll

  # Compiles the app and shell right away (linking needs the other jobs'
  # libraries, so link errors here are expected until the package job).
  app:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build shell libraries and compile the app
        run: |
          set -o pipefail
          pwsh -NoProfile -ExecutionPolicy Bypass -c "./tools/fetch-deps.ps1 -Only headers,nuget; ./tools/build-shell.ps1" 2>&1 | tee build.log
          pwsh -NoProfile -ExecutionPolicy Bypass -c "./tools/build-app.ps1" 2>&1 | tee app.log || true
          # Only compile errors fail this job; missing-library link errors are expected here.
          if grep -qE ": (fatal )?error C[0-9]+|error MSB4|XamlCompiler error|error MIDL" app.log; then cp app.log build.log; exit 1; fi
      - if: failure()
        run: tools/ci-report.sh build.log App
      - if: success()
        run: tools/ci-report.sh app.log App warning
      - uses: actions/upload-artifact@v4
        with:
          name: shell-libs
          retention-days: 3
          path: |
            deps/lib/onyx_shell.lib
            deps/lib/rcheevos.lib

  package:
    needs: [azahar, dozen, app]
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          mkdir -p deps/lib deps/bin
          cp artifacts/azahar-lib/*.lib artifacts/shell-libs/*.lib deps/lib/
          cp artifacts/dozen-bin/*.dll deps/bin/
      - name: Build and sign the Xbox package
        run: |
          set -o pipefail
          pwsh -NoProfile -ExecutionPolicy Bypass -c "./tools/fetch-deps.ps1 -Only headers,nuget; ./tools/build-app.ps1" 2>&1 | tee build.log
      - if: failure()
        run: tools/ci-report.sh build.log Package
      - uses: actions/upload-artifact@v4
        with:
          # Developer test build: not a release. Players install from Releases.
          name: DEV-BUILD-UNTESTED-ONYX3DS
          path: |
            out/AppPackages/**
            out/ONYX3DS.cer
            out/ONYX3DS.map
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: package
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DEV-BUILD-UNTESTED-ONYX3DS
          path: artifacts/ONYX3DS-xbox
      - name: Import scan and launch test
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/verify-package.ps1
      - if: always()
        run: |
          lvl=warning; [ "${{ job.status }}" = success ] || lvl=error
          tools/ci-annotate.sh report-imports.txt Imports $lvl
          tools/ci-annotate.sh report-launch.txt Launch $lvl

  # Publishes a GitHub Release with just what an install needs: the .msix and
  # its x64 dependency (plus the map file for decoding crash logs). Runs for
  # a v* tag, or on main when the package version (Package.appxmanifest,
  # e.g. 2.1.0.0 -> v2.1.0) has no release yet and its notes,
  # docs/releases/<tag>.md, are not marked "<!-- draft -->".
  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decide the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            ver=$(grep -oP '<Identity[^>]*Version="\K[0-9.]+' app/ONYX3DS/Package.appxmanifest)
            IFS=. read -r a b c d <<< "$ver"
            tag="v$a.$b.${c:-0}"
          fi
          notes="docs/releases/$tag.md"
          if [[ "$GITHUB_REF" != refs/tags/v* ]] && { [ ! -f "$notes" ] || grep -q '<!-- draft' "$notes"; }; then
            # Main builds only publish once the notes exist and are no longer
            # marked as a draft, so a version bump can be tested first.
            echo "Release notes for $tag are missing or a draft; not publishing."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - if: steps.tag.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: DEV-BUILD-UNTESTED-ONYX3DS
          path: pkg
      - name: Collect release files
        if: steps.tag.outputs.publish == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          msix=$(find pkg \( -name '*.msix' -o -name '*.appx' \) -not -path '*Dependencies*' | head -1)
          [ -n "$msix" ] || { echo "no package found"; exit 1; }
          cp "$msix" "dist/ONYX3DS-$TAG.msix"
          find pkg -path '*Dependencies/x64/*' -type f -exec cp {} dist/ \;
          if [ -f pkg/ONYX3DS.map ]; then cp pkg/ONYX3DS.map "dist/ONYX3DS-$TAG.map"; fi
          ls -la dist
      - name: Publish release
        if: steps.tag.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          notes="docs/releases/$TAG.md"
          [ -f "$notes" ] || notes=/dev/null
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "ONYX $TAG" --notes-file "$notes" --latest

  # Keeps each main build's map file on a rolling "dev" pre-release, named by the
  # link timestamp that ONYX writes to onyx.log ("Build stamp"), so offsets in a
  # profile or crash log can be decoded for exactly that build.
  dev-maps:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DEV-BUILD-UNTESTED-ONYX3DS
          path: pkg
      - name: Upload the map
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ -f pkg/ONYX3DS.map ] || { echo "no map"; exit 0; }
          stamp=$(grep -m1 -oP 'Timestamp is \K[0-9a-f]+' pkg/ONYX3DS.map)
          cp pkg/ONYX3DS.map "ONYX3DS-$stamp.map"
          notes="Developer debug files (linker maps for decoding logs). This is NOT a game build and there is nothing to install here. Players: install ONYX only from the latest numbered release (v2.x)."
          gh release view dev >/dev/null 2>&1 || gh release create dev --prerelease \
            --title "Developer debug files (not an install)" --notes "$notes"
          gh release edit dev --prerelease --title "Developer debug files (not an install)" --notes "$notes" 
          gh release upload dev "ONYX3DS-$stamp.map" --clobber
          # keep the newest 6
          gh release view dev --json assets --jq '.assets|sort_by(.createdAt)|reverse|.[6:]|.[].name' |
            while read -r n; do gh release delete-asset dev "$n" -y; done
