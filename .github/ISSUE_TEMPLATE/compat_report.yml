name: Game compatibility report
description: Tell us how a game runs (good or bad)
labels: [compatibility]
body:
  - type: input
    id: game
    attributes:
      label: Game and title ID
      placeholder: New Super Mario Bros. 2 (USA), 000400000007AE00
    validations:
      required: true
  - type: dropdown
    id: console
    attributes:
      label: Console
      options: [Xbox Series X, Xbox Series S, Xbox One X, Xbox One S, Xbox One]
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: How far does it get?
      options:
        - Doesn't boot
        - Boots to the menu / intro
        - In-game, with major problems
        - Playable, minor problems
        - Perfect
    validations:
      required: true
  - type: input
    id: fps
    attributes:
      label: Typical FPS
      description: Hold View and press A to show the FPS counter.
  - type: textarea
    id: settings
    attributes:
      label: Settings and notes
      description: Renderer, CPU JIT, Shader JIT, resolution, and anything that looked wrong.
